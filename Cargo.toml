[package]
name = "mouse"
version = "0.5.1"
edition = "2024"
description = "Mouse configuration for ATK R5 Ultra — DPI and button mapping"

[dependencies]
hidapi = "2.6.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true